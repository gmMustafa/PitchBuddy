# Streamlit Community Cloud puts apps to sleep after ~12h without visitors.
# This job opens the app in a real (headless) browser every 6 hours, which
# counts as a visit, and clicks the "wake up" button if the app is already asleep.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
#        add  APP_URL = https://<your-app>.streamlit.app
name: keep-alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.48.0 && playwright install --with-deps chromium
      - name: Visit app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          python - <<'EOF'
          import os, time
          from playwright.sync_api import sync_playwright
          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, timeout=60000)
              time.sleep(5)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("App was asleep - waking it")
                  wake.click()
                  time.sleep(90)
              else:
                  print("App is awake")
          EOF
